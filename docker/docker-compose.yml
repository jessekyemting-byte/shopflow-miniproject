name: shopflow
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  db-init:
    build: ../application/backend
    image: shopflow-api:1.0.0
    command: ["sh", "-c", "flask --app app init-db && flask --app app seed"]
    environment: &backend-env
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: "no"

  backend:
    build: ../application/backend
    image: shopflow-api:1.0.0
    ports: ["5000:5000"]
    environment: *backend-env
    depends_on:
      db-init: { condition: service_completed_successfully }

  frontend:
    build: ../application/frontend
    image: shopflow-frontend:1.0.0
    ports: ["8080:8080"]
    depends_on:
      backend: { condition: service_healthy }

volumes:
  pgdata:
