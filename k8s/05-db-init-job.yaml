apiVersion: batch/v1
kind: Job
metadata:
  name: db-init
  namespace: shopflow
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: db-init
        image: shopflow-api:1.0.0
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c", "flask --app app init-db && flask --app app seed"]
        envFrom:
        - configMapRef:
            name: shopflow-config
        - secretRef:
            name: shopflow-secrets
