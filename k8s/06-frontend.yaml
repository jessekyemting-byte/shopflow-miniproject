apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: shopflow
spec:
  type: NodePort
  ports:
  - port: 8080
    nodePort: 30080
  selector:
    app: frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: shopflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: shopflow-frontend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
