apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shopflow
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/jessekyemting-byte/shopflow-miniproject.git'
    targetRevision: main
    path: k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: shopflow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
