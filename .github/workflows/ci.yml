name: ShopFlow CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: application/backend/requirements.txt
      - name: Install dependencies
        run: pip install -r application/backend/requirements.txt ruff pip-audit
      - name: Lint
        run: ruff check application/backend
      - name: Unit tests
        run: pytest application/backend/test_smoke.py -v
      - name: Dependency vulnerability scan
        run: pip-audit -r application/backend/requirements.txt

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
