name: ShopFlow CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: application/backend/requirements.txt
      - name: Install dependencies
        run: pip install -r application/backend/requirements.txt ruff==0.17.4 pip-audit
      - name: Lint
        run: ruff check application/backend
      - name: Unit tests
        run: pytest application/backend/test_smoke.py -v
      - name: Dependency vulnerability scan
        run: pip-audit -r application/backend/requirements.txt

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker lint, build and scan
    needs: [test, secrets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hadolint (backend)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: application/backend/Dockerfile
          failure-threshold: warning
      - name: Hadolint (frontend)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: application/frontend/Dockerfile
          failure-threshold: warning
      - name: Validate Compose file
        run: docker compose -f docker/docker-compose.yml --env-file docker/.env.example config -q
      - name: Build images
        run: |
          docker build -t shopflow-api:${{ github.sha }} application/backend
          docker build -t shopflow-frontend:${{ github.sha }} application/frontend
      - name: Trivy scan (backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: shopflow-api:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy scan (frontend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: shopflow-frontend:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
